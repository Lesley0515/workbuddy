<style>
:root{
  --c-daily:#6366f1; --c-xhs:#ff2442; --c-job:#10b981; --c-eng:#f59e0b;
  --c-book:#8b5cf6; --c-shoot:#06b6d4; --c-clip:#ec4899; --c-fit:#22c55e;

}
*{-webkit-tap-highlight-color:transparent;box-sizing:border-box}
html,body{margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB",sans-serif;background:#f3f4f6;overflow:hidden;height:100%}
.app{display:flex;height:100vh;height:100dvh}
.sidebar{width:64px;background:#1e293b;display:flex;flex-direction:column;align-items:center;padding:8px 0;gap:4px;overflow-y:auto;flex-shrink:0;z-index:30}
.sidebar.hidden{display:none}
.sidebar::-webkit-scrollbar{display:none}
.sidebar-toggle{width:56px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#94a3b8;font-size:18px;flex-shrink:0;margin-bottom:4px}
.sidebar-toggle:active{color:#fff;background:rgba(255,255,255,.15)}
.float-ball{position:fixed;width:48px;height:48px;border-radius:50%;background:rgba(30,41,59,.85);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:#fff;display:none;align-items:center;justify-content:center;cursor:pointer;font-size:22px;z-index:50;box-shadow:0 4px 16px rgba(0,0,0,.3);border:2px solid rgba(255,255,255,.2);transition:transform .15s,box-shadow .15s;user-select:none;-webkit-user-select:none;touch-action:none}
.float-ball.show{display:flex}
.float-ball:active{transform:scale(1.15);box-shadow:0 6px 20px rgba(0,0,0,.4)}
.float-ball.dragging{transition:none;opacity:.9;transform:scale(1.2)}
.nav-item{width:56px;height:56px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;color:#94a3b8;font-size:9px;gap:3px;transition:all .15s;flex-shrink:0}
.nav-item .icon{font-size:20px;line-height:1}
.nav-item.active{background:rgba(255,255,255,.1);color:#fff}
.nav-item.active .icon{transform:scale(1.1)}
.main{flex:1;overflow-y:auto;position:relative}
.main::-webkit-scrollbar{width:0}
.panel{display:none;padding:12px;padding-bottom:80px}
.panel.active{display:block;animation:fadeIn .25s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.card{background:#fff;border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.card-title{font-weight:700;font-size:15px;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.btn{padding:8px 16px;border-radius:10px;border:none;font-size:14px;font-weight:600;cursor:pointer;transition:all .15s}
.btn-primary{background:var(--c-daily);color:#fff}
.btn-sm{padding:5px 10px;font-size:12px;border-radius:8px}
input,textarea,select{font-family:inherit;font-size:14px}
.field{width:100%;padding:10px;border:1px solid #e2e8f0;border-radius:10px;font-size:14px;outline:none;transition:border .2s}
.field:focus{border-color:var(--c-daily)}
.badge{display:inline-block;padding:2px 8px;border-radius:6px;font-size:11px;font-weight:600}
.empty{text-align:center;color:#94a3b8;padding:24px 12px;font-size:13px}
.fab{position:fixed;right:16px;bottom:20px;width:52px;height:52px;border-radius:50%;background:var(--c-daily);color:#fff;border:none;font-size:28px;box-shadow:0 4px 14px rgba(0,0,0,.2);z-index:20;cursor:pointer;display:flex;align-items:center;justify-content:center}
.toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.8);color:#fff;padding:10px 20px;border-radius:10px;font-size:13px;z-index:99;display:none;max-width:80%;text-align:center}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:40;display:none;align-items:flex-end;justify-content:center}
.modal{background:#fff;width:100%;max-width:480px;border-radius:16px 16px 0 0;padding:16px;max-height:85vh;overflow-y:auto;animation:slideUp .25s ease}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:none}}
.task-item{display:flex;align-items:center;gap:10px;padding:10px;background:#f8fafc;border-radius:10px;margin-bottom:8px}
.task-item.done{opacity:.5}
.task-item .check{width:20px;height:20px;border:2px solid #cbd5e1;border-radius:6px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.task-item.done .check{background:var(--c-daily);border-color:var(--c-daily);color:#fff}
.progress-ring{width:60px;height:60px}
textarea.field{resize:vertical;min-height:60px}
.highlight-note{border-left:3px solid;padding:8px 12px;margin:6px 0;border-radius:6px;font-size:13px}
.tag{display:inline-block;padding:3px 8px;border-radius:6px;font-size:11px;margin:2px;background:#e0e7ff;color:#3730a3}
</style>

<body>
<div class="app">
  <nav class="sidebar" id="sidebar"></nav>
  <div class="float-ball" id="floatToggle">☰</div>
  <main class="main" id="main"></main>
</div>
<button class="fab" id="fab" style="display:none">+</button>
<div class="toast" id="toast"></div>
<div class="modal-overlay" id="modalOverlay">

<script>
// ============ 全局状态 ============
const STORE_KEY = 'workbench_data_v1';
const APP_VERSION = '2';
let store = loadStore();
let currentPanel = 'daily';

// 版本升级检测：如果旧版本号不同，提示刷新
(function(){
  const oldVer = localStorage.getItem('app_version');
  if(oldVer && oldVer !== APP_VERSION){
    // 不清数据，只提示
    setTimeout(()=>{ toast('🔔 工作台有新版本，请重新添加到主屏幕'); }, 2000);
  }
  localStorage.setItem('app_version', APP_VERSION);
})();

function loadStore(){
  try{ const s = localStorage.getItem(STORE_KEY); if(s) return JSON.parse(s); }catch(e){}
  return {};
}
function saveStore(){
  localStorage.setItem(STORE_KEY, JSON.stringify(store));
}
function getData(key, def){
  if(!store[key]) store[key] = def===undefined?[]:def;
  return store[key];
}
function setData(key,val){ store[key]=val; saveStore(); }

function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.style.display='block';
  clearTimeout(t._tm); t._tm=setTimeout(()=>t.style.display='none',1800);
}
function showModal(html){
  document.getElementById('modalContent').innerHTML=html;
  document.getElementById('modalOverlay').style.display='flex';
}
function closeModal(){
  document.getElementById('modalOverlay').style.display='none';
}
document.getElementById('modalOverlay').addEventListener('click',e=>{
  if(e.target.id==='modalOverlay') closeModal();
});

// ============ 导航配置 ============
const NAV = [
  {id:'daily',icon:'📅',label:'每日',color:'var(--c-daily)'},
  {id:'xhs',icon:'📕',label:'小红书',color:'var(--c-xhs)'},
  {id:'job',icon:'💼',label:'求职',color:'var(--c-job)'},
  {id:'eng',icon:'🔤',label:'英语',color:'var(--c-eng)'},
  {id:'book',icon:'📚',label:'读书',color:'var(--c-book)'},
  {id:'shoot',icon:'📷',label:'拍摄',color:'var(--c-shoot)'},
  {id:'clip',icon:'🎬',label:'剪辑',color:'var(--c-clip)'},
  {id:'fit',icon:'⚖️',label:'减肥',color:'var(--c-fit)'},
  {id:'acct',icon:'💰',label:'记账',color:'var(--c-acct)'},
];

function buildSidebar(){
  const sb=document.getElementById('sidebar');
  sb.innerHTML = `<div class="sidebar-toggle" onclick="toggleSidebar()">«</div>` + NAV.map(n=>`
    <div class="nav-item ${n.id===currentPanel?'active':''}" data-id="${n.id}" style="${n.id===currentPanel?'border-left:3px solid '+n.color:''}">
      <span class="icon">${n.icon}</span>
      <span>${n.label}</span>
    </div>`).join('');
  sb.querySelectorAll('.nav-item').forEach(el=>{
    el.onclick=()=>switchPanel(el.dataset.id);
  });
}

function toggleSidebar(){
  const sb=document.getElementById('sidebar');
  const ft=document.getElementById('floatToggle');
  if(sb.classList.contains('hidden')){
    sb.classList.remove('hidden');
    ft.classList.remove('show');
  }else{
    sb.classList.add('hidden');
    ft.classList.add('show');
  }
}

// ============ 悬浮球拖动 ============
(function(){
  let ball=null, isDragging=false, hasMoved=false;
  let startX=0, startY=0, ballX=0, ballY=0;
  let offsetX=0, offsetY=0;

  function initFloatBall(){
    ball=document.getElementById('floatToggle');
    if(!ball)return;
    ball.addEventListener('touchstart',onTouchStart,{passive:false});
    ball.addEventListener('touchmove',onTouchMove,{passive:false});
    ball.addEventListener('touchend',onTouchEnd);
    ball.addEventListener('mousedown',onMouseDown);
    document.addEventListener('mousemove',onMouseMove);
    document.addEventListener('mouseup',onMouseUp);
  }

  function onTouchStart(e){
    e.preventDefault();
    const t=e.touches[0];
    startDrag(t.clientX,t.clientY);
  }
  function onTouchMove(e){
    e.preventDefault();
    const t=e.touches[0];
    doDrag(t.clientX,t.clientY);
  }
  function onTouchEnd(){ endDrag(); }
  function onMouseDown(e){
    e.preventDefault();
    startDrag(e.clientX,e.clientY);
  }
  function onMouseMove(e){
    if(!isDragging)return;
    doDrag(e.clientX,e.clientY);
  }
  function onMouseUp(){ endDrag(); }

  function startDrag(cx,cy){
    if(!ball)return;
    isDragging=true; hasMoved=false;
    const rect=ball.getBoundingClientRect();
    ballX=rect.left; ballY=rect.top;
    offsetX=cx-rect.left; offsetY=cy-rect.top;
    startX=cx; startY=cy;
    ball.classList.add('dragging');
  }

  function doDrag(cx,cy){
    if(!isDragging||!ball)return;
    const nx=cx-offsetX, ny=cy-offsetY;
    const maxX=window.innerWidth-48, maxY=window.innerHeight-48;
    const clampedX=Math.max(4,Math.min(nx,maxX));
    const clampedY=Math.max(4,Math.min(ny,maxY));
    if(Math.abs(cx-startX)>6||Math.abs(cy-startY)>6) hasMoved=true;
    ball.style.left=clampedX+'px'; ball.style.top=clampedY+'px';
    ball.style.right='auto'; ball.style.bottom='auto';
    ballX=clampedX; ballY=clampedY;
  }

  function endDrag(){
    if(!ball)return;
    isDragging=false;
    ball.classList.remove('dragging');
    if(!hasMoved) toggleSidebar();
    const centerX=ballX+24;
    const targetX=centerX<window.innerWidth/2?4:window.innerWidth-52;
    ball.style.transition='left .3s ease,transform .15s';
    ball.style.left=targetX+'px';
    setTimeout(()=>{ if(ball) ball.style.transition=''; },300);
  }

  if(document.readyState==='loading'){
    document.addEventListener('DOMContentLoaded',initFloatBall);
  }else{ initFloatBall(); }
})();

function switchPanel(id){
  currentPanel=id;
  buildSidebar();
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  const p=document.getElementById('panel-'+id);
  if(p) p.classList.add('active');
  const nav=NAV.find(n=>n.id===id);
  if(nav) document.documentElement.style.setProperty('--c-daily',nav.color);
  const fab=document.getElementById('fab');
  const fabPanels=['xhs','fit','acct','eng'];
  if(fabPanels.includes(id)){
    fab.style.display='flex'; fab.style.background=nav.color; fab.onclick=()=>onFabClick(id);
  } else { fab.style.display='none'; }
  if(id==='daily') renderDaily();
  else if(id==='xhs') renderXHS();
  else if(id==='job') renderJob();
  else if(id==='eng') renderEng();
  else if(id==='book') renderBook();
  else if(id==='shoot') renderShoot();
  else if(id==='clip') renderClip();
  else if(id==='fit') renderFit();
  else if(id==='acct') renderAcct();
  document.getElementById('main').scrollTop=0;
}

function onFabClick(id){
  if(id==='xhs') addNotePlan();
  else if(id==='fit') addMealLog();
  else if(id==='acct') addAccountEntry();
  else if(id==='eng') addCustomWord();
}

// FAB for fit module
function addMealLog(){ addMeal('breakfast'); }
function addAccountEntry(){ addEntry(); }

function initPanels(){
  const main=document.getElementById('main');
  main.innerHTML = NAV.map(n=>`<div class="panel" id="panel-${n.id}"></div>`).join('');
}

function todayKey(){ const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function fmtDate(d){
  const days=['日','一','二','三','四','五','六'];
  return `${d.getMonth()+1}月${d.getDate()}日 周${days[d.getDay()]}`;
}
function escapeHtml(s){ return (s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
</script>

<script>
// ============ 每日工作台 ============
const WEATHER_CODES={
  '0':'☀️ 晴','1':'🌤️ 多云','2':'⛅ 阴','3':'☁️ 阴',
  '45':'🌫️ 雾','48':'🌫️ 冻雾',
  '51':'🌦️ 小毛毛雨','53':'🌦️ 毛毛雨','55':'🌧️ 大毛毛雨',
  '56':'🌧️ 冻雨','57':'🌧️ 冻雨',
  '61':'🌧️ 小雨','63':'🌧️ 中雨','65':'⛈️ 大雨',
  '66':'🌧️ 冻雨','67':'🌧️ 冻雨',
  '71':'🌨️ 小雪','73':'🌨️ 中雪','75':'❄️ 大雪',
  '77':'🌨️ 米雪',
  '80':'🌦️ 小阵雨','81':'🌧️ 阵雨','82':'⛈️ 强阵雨',
  '85':'🌨️ 阵雪','86':'🌨️ 强阵雪',
  '95':'⛈️ 雷暴','96':'⛈️ 雷暴+冰雹','99':'⛈️ 强雷暴+冰雹'
};

function renderDaily(){
  dailyAutoRefresh();
  const el=document.getElementById('panel-daily');
  const d=new Date();
  const wInfo=getWeightToday();
  const autoTasks=collectAutoTasks();
  const manualTasks=getData('tasks',[]).filter(t=>t.date===todayKey());
  const todayTasks=[...autoTasks,...manualTasks];
  const doneCount=todayTasks.filter(t=>t.done).length;
  const pct=todayTasks.length?Math.round(doneCount/todayTasks.length*100):0;
  const weather=getWeatherCache();
  const weatherHtml = (weather && weather.date===todayKey() && weather.html) ? weather.html : '⏳ 获取天气中...';
  const bookNote=getDailyBookQuote();

  el.innerHTML=`
    <div style="background:linear-gradient(135deg,#6366f1,#818cf8);color:#fff;border-radius:16px;padding:16px;margin-bottom:12px">
      <div style="font-size:22px;font-weight:800">${fmtDate(d)}</div>
      <div style="display:flex;gap:16px;margin-top:8px;font-size:13px;opacity:.95;align-items:center">
        <span id="weatherDisplay">${weatherHtml}</span>
        ${wInfo?`<span>⚖️ ${wInfo}kg</span>`:''}
      </div>
    </div>
    <div class="card" style="background:#fffbeb;border:1px dashed #f59e0b">
      <div class="card-title" style="color:#92400e">🔄 数据同步</div>
      <p style="font-size:11px;color:#92400e;margin:0 0 8px">Safari和主屏幕App的数据不互通，用下方按钮同步</p>
      <div style="display:flex;gap:8px">
        <button class="btn btn-sm" style="flex:1;background:#f59e0b;color:#fff" onclick="exportAllData()">📤 导出数据</button>
        <button class="btn btn-sm" style="flex:1;background:#10b981;color:#fff" onclick="importAllData()">📥 导入数据</button>
      </div>
    </div>
    <div class="card">
      <div class="card-title">📊 今日完成度</div>
      <div style="display:flex;align-items:center;gap:12px">
        <svg class="progress-ring" viewBox="0 0 60 60">
          <circle cx="30" cy="30" r="25" fill="none" stroke="#e2e8f0" stroke-width="6"/>
          <circle cx="30" cy="30" r="25" fill="none" stroke="var(--c-daily)" stroke-width="6"
            stroke-dasharray="${2*Math.PI*25}" stroke-dashoffset="${2*Math.PI*25*(1-pct/100)}"
            stroke-linecap="round" transform="rotate(-90 30 30)" style="transition:stroke-dashoffset .5s"/>
          <text x="30" y="35" text-anchor="middle" font-size="14" font-weight="700" fill="var(--c-daily)">${pct}%</text>
        </svg>
        <div style="font-size:13px;color:#64748b">
          完成 ${doneCount} / ${todayTasks.length} 项任务<br>
          ${pct===100?'🎉 今天全部搞定！':pct>=50?'继续加油！':'开始行动吧！'}
        </div>
      </div>
    </div>
    ${bookNote?`
      <div class="card" style="background:linear-gradient(135deg,#faf5ff,#f5f3ff);border-left:3px solid #8b5cf6">
        <div class="card-title" style="color:#6d28d9">📖 每日书摘</div>
        <div style="font-size:14px;line-height:1.8;color:#374151;font-style:italic">${escapeHtml(bookNote.text)}</div>
        <div style="font-size:12px;color:#7c3aed;margin-top:8px;font-weight:600">— 《${escapeHtml(bookNote.book)}》${bookNote.author?' · '+escapeHtml(bookNote.author):''}</div>
      </div>
    `:''}
    <div class="card">
      <div class="card-title" style="justify-content:space-between">
        <span>📝 今日待办</span>
        <button class="btn btn-sm btn-primary" onclick="addTask()">+ 自定义</button>
      </div>
      <div id="taskList">
        ${todayTasks.length?todayTasks.map(t=>`
          <div class="task-item ${t.done?'done':''}">
            <div class="check" onclick="toggleTask('${t.id}',${t.auto?'true':'false'})">${t.done?'✓':''}</div>
            <div style="flex:1;font-size:14px">
              <div style="${t.done?'text-decoration:line-through':''}">${escapeHtml(t.text)}</div>
              ${t.tag?`<span class="badge" style="background:${t.tagColor||'#e0e7ff'};color:${t.tagText||'#3730a3'}">${t.tag}</span>`:''}
              ${t.auto?'<span style="font-size:10px;color:#94a3b8;margin-left:4px">自动</span>':''}
            </div>
            ${t.auto?'':`<span style="color:#cbd5e1;cursor:pointer;font-size:18px" onclick="delTask('${t.id}')">⋯</span>`}
          </div>
        `).join(''):'<div class="empty">暂无任务，开始记录你的一天吧</div>'}
      </div>
    </div>
  `;
  if(!weather || weather.date!==todayKey()){ fetchWeather(); }
}

  {text:'许多人所谓的成熟，不过是被习俗磨去了棱角。',book:'灵魂只能独行',author:'周国平'},
  {text:'你若爱，生活哪里都可爱。',book:'豁然开朗',author:'丰子恺'},
  {text:'人最宝贵的是生命，生命属于每个人只有一次。',book:'钢铁是怎样炼成的',author:'奥斯特洛夫斯基'},
  {text:'生存还是毁灭，这是一个值得思考的问题。',book:'哈姆雷特',author:'莎士比亚'},
  {text:'友谊是两颗心真诚相待，而不是一颗心对另一颗心的敲打。',book:'鲁迅杂文选',author:'鲁迅'},

function getDailyBookQuote(){

function dailyAutoRefresh(){
  const today=todayKey();
  const lastActive=getData('last_active_date','');
  if(lastActive===today)return;
  setData('last_active_date',today);
  const hotCache=getData('xhs_hot_cache',null);
  if(hotCache && hotCache.date!==today){
    hotCache.items.push(hotCache.items.shift());
    hotCache.date=today;
    setData('xhs_hot_cache',hotCache);
  }
}

function collectAutoTasks(){
  const tasks=[];
  const today=todayKey();
  const autoDone=getData('auto_tasks_done',[]);
  const tagStyles={
    '小红书':{bg:'#fef2f4',text:'#ff2442'},'求职':{bg:'#dcfce7',text:'#166534'},
    '英语':{bg:'#fef3c7',text:'#92400e'},'读书':{bg:'#ede9fe',text:'#6d28d9'},
    '减肥':{bg:'#f0fdf4',text:'#166534'},'记账':{bg:'#ccfbf1',text:'#0f766e'}
  };
  const makeAuto=(id,text,tag)=>{
    return {id,text,tag,tagColor:tagStyles[tag]?.bg||'#e0e7ff',tagText:tagStyles[tag]?.text||'#3730a3',done:autoDone.includes(id),auto:true};
  };
  const xhsPlans=getData('xhs_plans',[]);
  xhsPlans.filter(p=>p.status==='pending' && p.date<=today).forEach(p=>{
    tasks.push(makeAuto('auto_xhs_'+p.id,`发布小红书笔记：${p.title}`,'小红书'));
  });
  const todayXhsDone=xhsPlans.some(p=>p.status==='done' && p.date===today);
  if(!todayXhsDone) tasks.push(makeAuto('auto_xhs_daily','今日发布至少1篇小红书笔记','小红书'));
  const jobProfile=getData('job_profile',null);
  const jobApps=getData('job_apps',[]);
  if(jobProfile && jobApps.length===0) tasks.push(makeAuto('auto_job_search','根据简历分析结果，搜索并投递岗位','求职'));
  jobApps.filter(a=>a.status==='面试').forEach(a=>{
    tasks.push(makeAuto('auto_job_interview_'+a.id,`准备面试：${a.company} - ${a.position}`,'求职'));
  });
  const engProgress=getData('eng_progress',{lastDate:''});
  if(engProgress.lastDate!==today) tasks.push(makeAuto('auto_eng_words','完成今日10个英语单词学习','英语'));
  const shadowDone=engProgress.shadowDone||[];
  if(!shadowDone.includes(today)) tasks.push(makeAuto('auto_eng_shadow','完成今日影子跟读练习','英语'));
  const currentBook=getData('book_current',null);
  if(currentBook && (currentBook.progress||0)<100){
    tasks.push(makeAuto('auto_book_read',`阅读《${currentBook.title}》（当前${currentBook.progress||0}%）`,'读书'));
  }
  const weights=getData('fit_weights',[]);
  if(!weights.find(w=>w.date===today)) tasks.push(makeAuto('auto_fit_weight','记录今日空腹体重','减肥'));
  const meals=getData('fit_meals',[]).filter(m=>m.date===today);
  const mealNames={breakfast:'早餐',lunch:'午餐',dinner:'晚餐'};
  ['breakfast','lunch','dinner'].forEach(meal=>{
    if(!meals.find(m=>m.meal===meal)) tasks.push(makeAuto('auto_fit_'+meal,`记录${mealNames[meal]}并估算热量`,'减肥'));
  });
  const acctEntries=getData('acct_entries',[]);
  if(!acctEntries.find(e=>e.date===today)) tasks.push(makeAuto('auto_acct_today','记录今日收支','记账'));
  return tasks;
}

function getWeatherCache(){ return getData('weather_cache',null); }
function fetchWeather(){
  const display=document.getElementById('weatherDisplay');
  if(display) display.innerHTML='⏳ 定位中...';
  if(!navigator.geolocation){ fetchWeatherByIP(); return; }
  navigator.geolocation.getCurrentPosition(
    pos=>{ fetchWeatherByCoords(pos.coords.latitude,pos.coords.longitude); },
    err=>{ fetchWeatherByIP(); },
    {timeout:5000,maximumAge:600000}
  );
}
function fetchWeatherByCoords(lat,lon){
  const display=document.getElementById('weatherDisplay');
  const url=`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,weather_code&timezone=auto`;
  fetch(url).then(r=>r.json()).then(data=>{
    if(data&&data.current){
      const temp=Math.round(data.current.temperature_2m);
      const hum=data.current.relative_humidity_2m;
      const code=data.current.weather_code;
      const desc=WEATHER_CODES[String(code)]||'🌡️ '+temp+'°';
      const html=`${desc} ${temp}°C · 湿度${hum}%`;
      setData('weather_cache',{date:todayKey(),html,temp,hum,code,source:'gps'});
      if(display) display.innerHTML=html;
    }
  }).catch(()=>{ if(display) display.innerHTML='🌤️ 天气获取失败'; });
}
function fetchWeatherByIP(){
  const display=document.getElementById('weatherDisplay');
  fetch('https://ip-api.com/json/?lang=zh-CN').then(r=>r.json()).then(data=>{
    if(data&&data.lat) fetchWeatherByCoords(data.lat,data.lon);
    else if(display) display.innerHTML='🌤️ 天气获取失败';
  }).catch(()=>{ if(display) display.innerHTML='🌤️ 天气获取失败'; });
}

function getWeightToday(){
  const weights=getData('fit_weights',[]);
  const t=weights.find(w=>w.date===todayKey());
  return t?t.value:null;
}
function addTask(){
  showModal(`
    <h3 style="font-size:16px;font-weight:700;margin:0 0 12px">新建自定义待办</h3>
    <input class="field" id="taskInput" placeholder="任务内容..." style="margin-bottom:8px">
    <select class="field" id="taskTag" style="margin-bottom:12px">
      <option value="">分类(可选)</option>
      <option value="小红书">小红书</option><option value="求职">求职</option>
      <option value="英语">英语</option><option value="读书">读书</option>
      <option value="拍摄">拍摄</option><option value="剪辑">剪辑</option>
      <option value="运动">运动</option><option value="其他">其他</option>
    </select>
    <div style="display:flex;gap:8px">
      <button class="btn" style="flex:1;background:#e2e8f0" onclick="closeModal()">取消</button>
      <button class="btn btn-primary" style="flex:1" onclick="saveTask()">保存</button>
    </div>
  `);
  setTimeout(()=>document.getElementById('taskInput').focus(),100);
}
function saveTask(){
  const text=document.getElementById('taskInput').value.trim();
  if(!text){toast('请输入任务内容');return}
  const tag=document.getElementById('taskTag').value;
  const tasks=getData('tasks',[]);
  tasks.push({id:uid(),text,tag,date:todayKey(),done:false,created:Date.now()});
  setData('tasks',tasks); closeModal(); renderDaily(); toast('已添加');
}
function toggleTask(id,isAuto){
  if(isAuto){
    const done=getData('auto_tasks_done',[]);
    const idx=done.indexOf(id);
    if(idx>=0) done.splice(idx,1); else done.push(id);
    setData('auto_tasks_done',done);
  }else{
    const tasks=getData('tasks',[]);
    const t=tasks.find(x=>x.id===id); if(t) t.done=!t.done;
    setData('tasks',tasks);
  }
  renderDaily();
}
function delTask(id){
  if(!confirm('删除这个任务？'))return;
  let tasks=getData('tasks',[]);
  tasks=tasks.filter(t=>t.id!==id);
  setData('tasks',tasks); renderDaily();
}
</script>

function runReviewAI(id){
  const reviews=getData(XHS_REVIEW_KEY,[]);

function generateDetailedReview(r){
  let a=[];
  if(r.title){
    a.push(`<b>📌 标题分析：</b>`);
    if(r.title.length<=20) a.push(`• 标题长度${r.title.length}字，符合小红书推荐范围（18字以内最佳）`);
    else a.push(`• 标题长度${r.title.length}字，<span style="color:#ef4444">偏长</span>。建议压缩到20字以内，前10字必须出现核心关键词`);
    const emotionWords=['绝了','震惊','后悔','终于','发现','救命','谁懂','封神','挖到'];
    const hasEmotion=emotionWords.some(w=>r.title.includes(w));
    if(hasEmotion) a.push(`• ✅ 使用了情绪词，有利于提升点击率`);
    else a.push(`• 💡 建议加入情绪词，如"绝了/救命/后悔没早买/被问爆"`);
    if(/戒指|饰品|配饰/.test(r.title)) a.push(`• ✅ 品类关键词清晰，目标用户明确`);
    else a.push(`• 💡 标题中建议明确出现"戒指/饰品/配饰"等品类词`);
    if(/叠戴|小众|925|银|金|珍珠/.test(r.title)) a.push(`• ✅ 包含当前热门关键词（叠戴/小众/材质），易获得搜索流量`);
    else a.push(`• 💡 可加入"叠戴/小众/925银"等当前爆款关键词`);
  }
  if(r.img){
    a.push(`<br><b>🖼️ 封面/配图分析：</b>`);
    a.push(`• 截图已接收，AI从视觉角度给出建议：`);
    a.push(`• 检查产品是否位于画面视觉中心（黄金分割点）`);
    a.push(`• 检查背景是否简洁，是否突出戒指/饰品质感`);
    a.push(`• 检查手部/佩戴展示是否自然，光线是否柔和`);
    a.push(`• 建议封面加少量文字时，字体要粗、颜色与背景对比强烈`);
  }
  a.push(`<br><b>🏷️ 标签建议：</b>`);
  a.push(`• 必选标签：#戒指 #小众饰品 #配饰分享 #饰品店`);
  a.push(`• 场景标签：#日常搭配 #约会穿搭 #送礼推荐`);
  a.push(`• 热点标签：#叠戴风 #国风珠宝 #珍珠戒指`);
  a.push(`• 建议每篇笔记使用5-8个标签，不要过多`);
  if(r.views>0){
    a.push(`<br><b>📊 数据诊断：</b>`);
    const ctr=(r.likes/r.views*100).toFixed(1);
    const engage=((r.likes+r.comments+r.collects)/r.views*100).toFixed(1);
    a.push(`• 点击率相关：互动率 ${ctr}% ${ctr>5?'（优秀）':ctr>2?'（中等）':'（偏低，需优化封面和标题）'}`);
    a.push(`• 综合互动率：${engage}%（行业均值3-5%）`);
    if(r.collects>r.likes) a.push(`• ✅ 收藏>点赞，说明内容有实用价值，用户愿意"留着参考"`);
    if(r.comments===0 && r.views>50) a.push(`• 💡 零评论，建议在文案结尾增加提问式引导`);
  }
  a.push(`<br><b>🎯 优化方案：</b>`);
  a.push(`• 标题公式：情绪词 + 品类 + 效果/场景（例："救命！这枚戒指叠戴也太显白了吧"）`);
  a.push(`• 封面公式：手部特写/佩戴图 + 自然光 + 纯色背景`);
  a.push(`• 文案结构：痛点引入 → 产品亮点 → 使用场景 → 互动引导`);
  a.push(`• 发布时段：19:00-22:00 为小红书流量高峰`);
  a.push(`• 发布后2小时内积极回复评论，可提升笔记权重`);
  return a.join('<br>');
}

function delReview(id){

function analyzeAccount(acc,reviews,plans){
  let a=[];
  a.push(`<b>基础数据：</b>粉丝 ${acc.fans}，获赞 ${acc.likes}，收藏 ${acc.collects}，笔记 ${acc.notes||0}`);
  if(acc.fans<100){
    a.push(`• <span style="color:#ef4444">账号处于冷启动期</span>：粉丝不足100，建议每日坚持发布1-2篇，先打标签再求爆`);
  }else if(acc.fans<1000){
    a.push(`• 账号处于成长期：保持日更，重点优化封面和标题`);
  }else{
    a.push(`• 账号已有一定基础：可尝试爆款复制和粉丝互动活动`);
  }
  const noteCount=acc.notes||plans.filter(p=>p.status==='done').length;
  if(noteCount<10) a.push(`• 笔记数量较少（${noteCount}篇），建议先积累30篇以上内容，测试不同选题方向`);
  const completedReviews=reviews.filter(r=>r.completed).length;
  if(reviews.length===0) a.push(`• <span style="color:#ef4444">尚未进行笔记复盘</span>：每发一篇都应复盘，才能持续优化`);
  else if(completedReviews<reviews.length) a.push(`• 有 ${reviews.length-completedReviews} 条复盘待完成学习，建议认真阅读AI分析并执行`);
  else a.push(`• ✅ 复盘习惯良好，已完成 ${completedReviews} 条复盘学习`);
  if(acc.likes>0 && acc.fans>0){
    const fanRatio=(acc.likes/acc.fans).toFixed(1);
    a.push(`• 赞粉比：${fanRatio} ${fanRatio>2?'（内容质量不错）':'（需提升内容吸引力）'}`);
  }
  if(acc.collects>acc.likes) a.push(`• ✅ 收藏数高于点赞，说明内容具有工具/参考价值，适合继续产出此类内容`);
  return a.join('<br>');
}
function generateImprovePlan(acc,reviews,plans){
  let a=[];
  a.push(`<b>近期行动清单：</b>`);
  const pending=plans.filter(p=>p.status==='pending').length;
  if(pending===0) a.push(`• 发布计划为空，建议每天至少发布1篇小红书笔记（这是每日任务的核心）`);
  else a.push(`• 有 ${pending} 条待发布计划，优先执行`);
  a.push(`• 选题方向：结合当前爆款趋势，优先做「叠戴风戒指」「国风元素戒指」「925银小众戒指」`);
  a.push(`• 封面优化：统一风格，使用手部特写+自然光+浅色背景`);
  a.push(`• 发布时间：固定在 19:00-22:00 发布，提高初始流量`);
  a.push(`• 互动维护：发布后2小时内回复所有评论，提升账号活跃度`);
  if(acc.fans<100) a.push(`• 冷启动策略：前30篇不要追求爆款，重点测试3-5个选题方向，找到数据反馈最好的再深耕`);
  a.push(`• 复盘频率：每发一篇笔记，24小时后进行数据复盘，记录CTR、互动率、收藏率`);
  return a.join('<br>');
}

function generateXHSTitle(type,points,scene){

}

function extractUrl(text){
  const m=text.match(/https?:\/\/[^\s\)\]\,\u4e00-\u9fa5]+/);
  return m?m[0].replace(/[\)\]\,\.\uff0c\u3002]+$/,''):'';
}
function extractShareTitle(text){
  // 提取链接前面的中文标题
  const m=text.match(/(.{2,50}?)(?=https?:\/\/)/);
  return m?m[1].replace(/[\n\r\s]+/g,' ').trim():'';
}

function detectPlatform(url){
  if(/xiaohongshu|xhslink/i.test(url)) return '小红书';
  if(/douyin|v\.douyin/i.test(url)) return '抖音';
  if(/bilibili|b23\.tv/i.test(url)) return 'B站';
  if(/weibo/i.test(url)) return '微博';
  return '未知平台';
}
function buildRealAnalysis(platform,inter,title,desc,text,contentType,kw,url){
  const likes=inter.likes||0, saves=inter.saves||0, cmts=inter.comments||0;
  const total=likes+saves*2+cmts*1.5;
  let level;
  if(total>10000) level='S级超级爆款 💎';
  else if(total>3000) level='A级热门爆款 ⭐';
  else if(total>800) level='B级潜力爆款 📈';
  else if(total>100) level='C级小爆款 🌱';
  else level='数据待确认（可手动补充）';

  // === 从真实内容中提取关键信息 ===
  const fullText=(title+' '+desc+' '+text).toLowerCase();
  const titleText=(title||'').toLowerCase();

  // 提取标题中的情绪词
  const emotionWords=[];
  const emotionDict={exclaim:['救命','天哪','绝了','震惊','啊啊','谁懂','尖叫','封神','哭了'],question:['为什么','怎么','如何','是什么','要不要','能不能'],number:['个','种','款','条','次','步','招','元','块','万'],compare:['vs','对比','平替','差别','哪个','还是'],action:['试试','冲','入手','get','买','收藏','码住','学']};
  for(const[cat,words]of Object.entries(emotionDict)){
    for(const w of words){if(titleText.includes(w)){emotionWords.push(cat);break;}}
  }

  // 提取内容中的关键词
  const allWords=fullText.replace(/[^\u4e00-\u9fa5a-zA-Z]/g,' ').split(/\s+/).filter(w=>w.length>=2);
  const wordFreq={};
  const stopWords=new Set(['一个','可以','这个','什么','我们','他们','自己','没有','已经','还是','因为','所以','但是','如果','而且','然后','就是','不是','不过','非常','比较','全部','所有','大家','你们','怎么','怎样','哪里','这么','那么','这些','那些','一些','一下','一定','一直','一样','一起','什么','为什么','怎么','如何']);
  for(const w of allWords){
    if(stopWords.has(w)||w.length<2) continue;
    wordFreq[w]=(wordFreq[w]||0)+1;
  }
  const topWords=Object.entries(wordFreq).sort((a,b)=>b[1]-a[1]).slice(0,8).map(e=>e[0]);

  // === 基于真实内容生成分析 ===
  const reasons=[];

  // 分析标题
  if(title){
    if(emotionWords.includes('exclaim')) reasons.push('标题使用强情绪词（"'+title.slice(0,30)+'..."），激发用户点击欲望');
    if(emotionWords.includes('question')) reasons.push('标题采用疑问句式制造悬念，引导用户点击查看答案');
    if(emotionWords.includes('number')) reasons.push('标题含数字/量化信息，增加可信度和具体感');
    if(title.length>20) reasons.push('标题信息量大（'+title.length+'字），充分传递内容价值');
    else if(title.length<=15) reasons.push('标题简短有力（'+title.length+'字），适合碎片化阅读场景');
  }

  // 分析内容类型
  if(contentType.includes('教程/攻略')) reasons.push('内容提供实用教程/攻略价值，这类内容收藏率通常最高');
  if(contentType.includes('测评/开箱')) reasons.push('测评/开箱类内容满足用户购买前决策需求，互动率高');
  if(contentType.includes('种草推荐')) reasons.push('种草推荐类内容天然适合带货转化，平台流量倾斜明显');
  if(contentType.includes('对比评测')) reasons.push('对比评测制造信息差，用户为获取结论更愿意完整阅读');
  if(contentType.includes('合集/清单')) reasons.push('合集/清单类内容信息密度高，用户倾向于收藏备用');
  if(contentType.includes('珠宝饰品')) reasons.push('珠宝饰品内容视觉吸引力强，高颜值图片+实拍是关键');
  if(contentType.includes('穿搭分享')) reasons.push('穿搭内容场景化强，用户容易代入产生"我也想要"心理');
  if(contentType.includes('Vlog/日常')) reasons.push('Vlog/日常内容真实感强，人格化表达增强粉丝粘性');

  // 分析互动数据
  if(likes>0&&saves>0){
    const saveRate=(saves/likes*100).toFixed(0);
    if(saveRate>60) reasons.push(`收藏率高达${saveRate}%（赞${likes}/藏${saves}），说明内容实用价值极高`);
    else if(saveRate>30) reasons.push(`收藏率${saveRate}%表现良好，内容兼具观赏性和实用性`);
    if(cmts>0&&cmts/likes>0.05) reasons.push(`评论互动率高（${(cmts/likes*100).toFixed(1)}%），标题或内容引发了用户讨论`);
  }

  // 分析内容关键词
  if(topWords.length>0){
    const kwStr=topWords.slice(0,5).join('、');
    reasons.push(`内容核心关键词围绕"${kwStr}"，精准定位目标受众`);
  }

  // 补足到至少4条
  const fallbackReasons=[
    '内容结构符合平台推荐算法偏好：开头抓人→中间干货→结尾引导互动',
    '发布时间推测在用户活跃高峰，获得初始曝光助推',
    '文��口语化表达，拉近与读者距离，降低阅读门槛',
    '利用平台流量分发机制，内容标签与搜索热词匹配度高'
  ];
  while(reasons.length<4){
    const fb=fallbackReasons[reasons.length%fallbackReasons.length];
    if(!reasons.includes(fb)) reasons.push(fb);
  }

  // === 标题公式 ===
  const formulas=[];
  if(title){
    // 分析原标题结构并生成变体
    const t=title.replace(/\s+/g,'');
    if(/[?!！？]/.test(t)) formulas.push('疑问/感叹型：'+(t.length>25?t.slice(0,22)+'...':t)+' → 保持悬念句式');
    else if(/\d/.test(t)) formulas.push('数字清单型：模仿原标题的数字+价值承诺结构');
    else formulas.push('情绪共鸣型：原标题风格偏情感驱动，可套用"情绪词+场景+结果"公式');
  }
  formulas.push('爆款公式：情绪词（救命/绝了）+ 核心卖点（'+topWords.slice(0,2).join('/')+'）+ 结果承诺（显白/高级/被夸）');
  formulas.push('痛点公式：你也在为['+(topWords[0]||'选择')+']烦恼吗？试试这个方法');
  formulas.push('反差公式：以为很贵vs实际白菜价｜'+topWords.slice(0,2).join('+')+'推荐');
  formulas.push('教程公式：手把手教你选'+topWords.slice(0,3).join('/')+'，收藏这篇就够了');

  // === 封面建议 ===
  let coverAdvice;
  if(contentType.includes('珠宝饰品')) coverAdvice='手部特写+自然光，突出质感；建议纯色背景（白/灰/米色），单品占画面60%以上，叠加关键词大字';
  else if(contentType.includes('穿搭')) coverAdvice='全身/半身搭配照，场景化背景（咖啡厅/街头），用拼图展示多角度，加文字标注品牌/价格';
  else if(contentType.includes('教程')) coverAdvice='大字标题占画面1/3，底图用成果展示，对比色标题文字，加上"保姆级""收藏"引导标签';
  else if(contentType.includes('测评')) coverAdvice='产品特写+评分标签，使用前后对比图，真实光线拍摄增加可信度';
  else coverAdvice='高清主体图+大字标题叠加，标题占画面1/3，用对比色突出，可加emoji增加视觉吸引力';

  // === 标签策略 ===
  const baseTags=[platform==='小红书'?'好物推荐':'热门',platform==='小红书'?'种草':'推荐'];
  const tags=[...new Set([...baseTags,...topWords.slice(0,5),kw].filter(Boolean))].slice(0,8);

  // === 行动清单 ===
  const actions=[
    `拆解原标题"${(title||'未知').slice(0,30)}"的结构，用你自己的产品替换关键词，写3个变体`,
    `参考这篇的内容类型（${contentType[0]}），策划你下一篇同类型笔记`,
    `提取这篇笔记的${topWords.slice(0,3).join('、')}等关键词，融入你的标签策略`,
    `观察这篇笔记的评论区（如有），找出用户最关心的3个问题作为新选题`,
    `模仿这篇的封面风格，用手机拍一组类似构图，测试点击率`
  ];

  return {level,reasons,titleFormulas:formulas,coverAdvice,tags,actions,platform,inter,contentType,pageTitle:title,pageDesc:desc};
}

<script>

                <div style="font-weight:600;font-size:13px">${escapeHtml(h.company||'未知公司')} · ${escapeHtml(h.position||'未知岗位')}</div>
                <div style="font-size:11px;color:#64748b;margin-top:2px">${escapeHtml(h.date||'')}</div>
              </div>
              <span class="badge" style="background:${h.risk==='低风险'?'#dcfce7':h.risk==='中风险'?'#fef3c7':'#fecaca'};color:#000;flex-shrink:0">${h.risk||'未评估'}</span>
            </div>

            <button class="btn btn-sm" style="margin-top:6px;background:#dcfce7;color:#166534" onclick="showJobDetail('${h.id}')">查看详情</button>

function analyzeJob(){
  const url=document.getElementById('jobUrl').value.trim();
  const desc=document.getElementById('jobDesc').value.trim();
  const img=document.getElementById('jobImg').files[0];
  if(!url&&!desc&&!img){toast('请至少填写一项');return}
  const r=document.getElementById('jobAnalysisResult');
  r.innerHTML='<div style="text-align:center;padding:20px;color:#94a3b8">🤖 AI正在分析公司背景、岗位真实性、技能要求...</div>';
  if(img){
    const reader=new FileReader();
    reader.onload=e=>{ window._jobImgData=e.target.result; };
    reader.readAsDataURL(img);
  }
  setTimeout(()=>{
    const result=doJobAnalysis(url,desc);
    r.innerHTML=result.html;
    const history=getData(JOB_ANALYSIS_KEY,[]);
    history.push({id:uid(),company:result.company,position:result.position,date:todayKey(),risk:result.risk,matchRate:result.matchRate,summary:result.summary,detail:result.detail,url:url||'',desc:desc||''});
    setData(JOB_ANALYSIS_KEY,history);
    toast('分析完成，已保存记录');
  },1500);
}

function doJobAnalysis(url,desc){
  let company='未知公司',position='未知岗位';
  if(desc){
    const companyMatch=desc.match(/(?:公司|企业|单位)[：:]\s*(.+?)[\n，,]/);
    if(companyMatch) company=companyMatch[1].trim();
    const posMatch=desc.match(/(?:岗位|职位|招聘)[：:]\s*(.+?)[\n，,]/);
    if(posMatch) position=posMatch[1].trim();
    if(company==='未知公司'){ const lines=desc.split('\n').filter(l=>l.trim()); if(lines.length) company=lines[0].trim().slice(0,20); }
  }
  if(url){
    if(url.includes('zhipin')) company=company==='未知公司'?'BOSS直聘岗位':company;
    if(url.includes('lagou')) company=company==='未知公司'?'拉勾岗位':company;
    if(url.includes('liepin')) company=company==='未知公司'?'猎聘岗位':company;
  }
  const riskAnalysis=analyzeCompanyRisk(company,desc,url);
  const skillAnalysis=analyzeJobSkills(desc);
  const profile=getJobProfile();
  let matchRate='未上传简历，无法匹配',matchDetail='';
  if(profile){ const match=calculateMatch(profile,desc); matchRate=match.rate; matchDetail=match.detail; }
  const detail={risk:riskAnalysis.risk,companyBg:riskAnalysis.background,redFlags:riskAnalysis.redFlags,skills:skillAnalysis.skills,match:matchDetail,advice:skillAnalysis.advice};
  const html=`
    <div style="background:#f0fdf4;padding:14px;border-radius:10px;font-size:13px;line-height:1.8">
      <div style="font-weight:700;color:#10b981;margin-bottom:8px;font-size:15px">📊 AI分析结果</div>
      <div style="margin-bottom:10px"><b>🏢 公司/岗位：</b>${escapeHtml(company)} · ${escapeHtml(position)}</div>
      <div style="margin-bottom:10px"><b>⚠️ 风险评估：</b><span class="badge" style="background:${riskAnalysis.risk==='低风险'?'#dcfce7':riskAnalysis.risk==='中风险'?'#fef3c7':'#fecaca'};color:#000">${riskAnalysis.risk}</span></div>
      <div style="margin-bottom:10px"><b>🔎 公司背景分析：</b><br>${riskAnalysis.background}</div>
      <div style="margin-bottom:10px"><b>🚩 风险红旗：</b><br>${riskAnalysis.redFlags}</div>
      <div style="margin-bottom:10px"><b>🎯 岗位技能要求：</b><br>${skillAnalysis.skills}</div>
      <div style="margin-bottom:10px"><b>📋 技能匹配度：</b>${matchRate}<br>${matchDetail}</div>
      <div style="margin-bottom:6px"><b>💡 投递建议：</b><br>${skillAnalysis.advice}</div>
    </div>
    <button class="btn" style="width:100%;margin-top:8px;background:#e2e8f0" onclick="document.getElementById('jobAnalysisResult').innerHTML=''">清空结果</button>
  `;
  return {company,position,risk:riskAnalysis.risk,matchRate,summary:riskAnalysis.background.replace(/<[^>]+>/g,'').slice(0,80),detail,html};
}

function analyzeCompanyRisk(company,desc,url){
  let risk='低风险',redFlags=[],bg=[];
  if(desc){
    if(/兼职|刷单|日结|高薪|无需经验|学历不限|包吃住|月入过万/i.test(desc)){ redFlags.push('• ⚠️ 出现"高薪/日结/无需经验/月入过万"等诱导性词汇，需警惕'); risk='中风险'; }
    if(/押金|培训费|服装费|体检费|保证金/i.test(desc)){ redFlags.push('• 🚫 涉及"押金/培训费/保证金"等收费要求，高度疑似骗局'); risk='高风险'; }
    if(/加微信|加QQ|私聊|联系手机/i.test(desc) && !/邮箱|email|@/i.test(desc)){ redFlags.push('• ⚠️ 只留微信/手机联系方式，无企业邮箱，可信度存疑'); risk=risk==='低风险'?'中风险':risk; }
    if(/社保|五险一金|双休|年假|晋升/i.test(desc)) bg.push('• ✅ 提及社保/���休/年假等正规福利，企业运营较规范');
    if(/注册资本|成立|年份|规模|团队/i.test(desc)) bg.push('• 📋 JD中提及公司规模或成立时间，可进一步核实');
    const salaryMatch=desc.match(/(\d+)[-~](\d+)[kK万]/);
    if(salaryMatch){
      const low=parseInt(salaryMatch[1]),high=parseInt(salaryMatch[2]);
      if(low>30||high>50){ bg.push(`• 💰 薪资 ${salaryMatch[0]}，偏高，建议在BOSS/看准网核实该公司实际薪资水平`); risk=risk==='低风险'?'中风险':risk; }
      else bg.push(`• 💰 薪资 ${salaryMatch[0]}，在合理范围内`);
    }
  }
  if(url){
    if(url.includes('zhipin')) bg.push('• 📱 来源BOSS直聘，平台较正规，但仍需核实公司资质');
    if(url.includes('lagou')) bg.push('• 📱 来源拉勾招聘，互联网行业岗位较多');
    if(url.includes('liepin')) bg.push('• 📱 来源猎聘，中高端岗位为主');
  }
  if(!bg.length) bg.push('• 未检测到明显背景信息，建议在企查查/天眼查搜索公司全名，核实注册资本、成立时间、是否有法律纠纷');
  if(!redFlags.length) redFlags.push('• ✅ 未检测到明显风险信号，但仍建议核实公司资质');
  return {risk,background:bg.join('<br>'),redFlags:redFlags.join('<br>')};
}

function analyzeJobSkills(desc){
  let skills=[],advice=[];
  if(!desc) return {skills:'未提供岗位描述文本，请粘贴JD文本以获得精准技能分析',advice:'建议粘贴岗位描述文本，AI可以更精准地分析所需技能'};
  const skillMap={'运营':['运营','新媒体','内容','社群','用户增长','数据分析','SEO','投放'],'设计':['设计','UI','UX','PS','AI','Figma','Sketch','视觉','平面'],'开发':['开发','编程','Python','Java','JavaScript','React','Vue','Node','SQL','前端','后端'],'电商':['电商','店铺','商品','选品','供应链','客服','物流','淘宝','天猫','京东'],'营销':['营销','推广','品牌','活动','市场','BD','商务','渠道'],'数据':['数据','分析','BI','报表','Excel','SQL','Python','统计'],'管理':['管理','团队','项目','协调','跨部门','PMO']};
  Object.keys(skillMap).forEach(cat=>{
    const matched=skillMap[cat].filter(k=>desc.toLowerCase().includes(k.toLowerCase()));
    if(matched.length) skills.push(`• <b>${cat}</b>：${matched.join('、')}`);
  });
  const expMatch=desc.match(/(\d+)[年]?(?:以上)?(?:经验|工作)/);
  if(expMatch) skills.push(`• <b>经验要求</b>：${expMatch[0]}`);
  const eduMatch=desc.match(/(大专|本科|硕士|博士|学历不限)/);
  if(eduMatch) skills.push(`• <b>学历要求</b>：${eduMatch[0]}`);
  advice.push('• 投递前在企查查/天眼查核实公司真实性');
  advice.push('• 在看准网/脉脉查看该公司评价和薪资水平');
  advice.push('• 面试时确认：实际工作内容、试用期薪资比例、是否签正式劳动合同');
  if(skills.length>3) advice.push('• 该岗位技能要求较多，建议简历中重点突出匹配项');
  return {skills:skills.length?skills.join('<br>'):'未识别到明确技能要求，建议查看完整JD',advice:advice.join('<br>')};
}

function calculateMatch(profile,desc){
  if(!desc)return {rate:'无法计算',detail:''};
  const profileSkills=(profile.directions||[]).join(' ');
  const profileText=(profile.resume||'')+' '+profileSkills;
  const jobSkills=['运营','设计','开发','电商','营销','数据','管理','Python','Java','Excel','PS','Figma','小红书','抖音','内容','社群','选品','数据分析'];
  const matched=[],missing=[];
  jobSkills.forEach(s=>{
    if(desc.toLowerCase().includes(s.toLowerCase())){
      if(profileText.toLowerCase().includes(s.toLowerCase())) matched.push(s);
      else missing.push(s);
    }
  });
  const total=matched.length+missing.length;
  const rate=total>0?Math.round(matched.length/total*100):0;
  let rateText=rate>=70?'高度匹配 ✅':rate>=40?'部分匹配 ⚠️':'匹配度较低 ❌';
  rateText+=` (${rate}%)`;
  let detail='';
  if(matched.length) detail+=`• ✅ 你已具备：${matched.join('、')}<br>`;
  if(missing.length) detail+=`• ❌ 岗位要求但你简历未体现：${missing.join('、')}<br>`;
  detail+=`• 💡 建议：${rate>=70?'可以直接投递，面试时重点展示匹配技能':rate>=40?'可以投递，但建议在简历中补充相关经验或快速学习缺失技能':'建议先补充相关技能再投递，或寻找要求更匹配的岗位'}`;
  return {rate:rateText,detail};
}

function showJobDetail(id){
  const history=getData(JOB_ANALYSIS_KEY,[]);
  const h=history.find(x=>x.id===id);
  if(!h)return;
  const d=h.detail||{};

    <div style="font-size:13px;line-height:1.7;color:#374151;margin-bottom:10px">

      <b>🚩 风险红旗：</b><br>${d.redFlags||'无'}<br><br>
      <b>🎯 技能要求：</b><br>${d.skills||'无'}<br><br>
      <b>📋 匹配度：</b><br>${d.match||'无'}<br><br>
      <b>💡 建议：</b><br>${d.advice||'无'}
    </div>
    ${h.url?`<a href="${h.url}" target="_blank" class="btn" style="display:block;width:100%;background:#10b981;color:#fff;text-decoration:none;text-align:center;margin-bottom:8px">查看原链接</a>`:''}
    <button class="btn" style="width:100%;background:#e2e8f0" onclick="closeModal()">关闭</button>
  `);
}

function uploadResume(){
  const profile=getJobProfile();
  showModal(`
    <h3 style="font-size:16px;font-weight:700;margin:0 0 8px">📄 上传简历</h3>
    <p style="font-size:12px;color:#64748b;margin:0 0 12px">AI分析岗位时会自动对比你的技能与岗位要求</p>
    <label style="font-size:12px;color:#64748b">姓名</label>
    <input class="field" id="rName" value="${profile?escapeHtml(profile.name||''):''}" placeholder="你的姓名" style="margin:4px 0 10px">
    <label style="font-size:12px;color:#64748b">粘贴简历内容</label>
    <textarea class="field" id="rText" placeholder="教育背景、工作经历、技能等" style="margin:4px 0 12px;min-height:120px">${profile?escapeHtml(profile.resume||''):''}</textarea>
    <div style="display:flex;gap:8px">
      <button class="btn" style="flex:1;background:#e2e8f0" onclick="closeModal()">取消</button>
      <button class="btn" style="flex:1;background:#10b981;color:#fff" onclick="saveResume()">保存</button>
    </div>
  `);
}
function saveResume(){
  const name=document.getElementById('rName').value.trim();
  const text=document.getElementById('rText').value.trim();
  if(!text){toast('请粘贴简历内容');return}
  const analysis=doResumeAnalysis(name,text);
  const profile={name,resume:text,directions:analysis.directions,advice:analysis.advice,created:Date.now()};
  setData(JOB_KEY,profile);
  closeModal(); renderJob(); toast('简历已保存');
}
function doResumeAnalysis(name,text){
  let directions=[];
  if(/运营|新媒体|小红书|抖音|内容|文案|社群/i.test(text)) directions.push('运营','新媒体','内容');
  if(/设计|ui|ps|ai|figma|视觉/i.test(text)) directions.push('设计');
  if(/开发|编程|python|java|前端|后端|sql/i.test(text)) directions.push('开发');
  if(/电商|店铺|选品|供应链|淘宝|天猫/i.test(text)) directions.push('电商');
  if(/营销|推广|品牌|市场|商务/i.test(text)) directions.push('营销');
  if(/数据|分析|excel|bi|统计/i.test(text)) directions.push('数据分析');
  if(!directions.length) directions=['综合类'];
  return {directions,advice:'简历已保存，AI分析岗位时会自动匹配技能'};
}
function delResume(){
  if(!confirm('删除简历？'))return;
  setData(JOB_KEY,null); renderJob();
}
</script>

  {title:'《月亮与六便士》',author:'毛姆',score:9.0,cat:'文学',reason:'理想与现实的永恒命题。如果你曾在"安稳"和"追梦"之间犹豫，这本书会给你答案。'}
];

  const el=document.getElementById('panel-book');
  const current=getData(BOOK_KEY,null);
  const notes=getData(BOOK_NOTES_KEY,[]);
  const history=getData(BOOK_HISTORY_KEY,[]);
  const now=new Date();
  const monthKey=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;

  el.innerHTML=`
    <div style="background:linear-gradient(135deg,#8b5cf6,#a78bfa);color:#fff;border-radius:16px;padding:16px;margin-bottom:12px">

        <span>📖 当前阅读</span>

      </div>
      ${current?`
        <div style="padding:12px;background:#faf5ff;border-radius:10px">
          <div style="font-weight:700;font-size:15px">${escapeHtml(current.title)}</div>
          <div style="font-size:12px;color:#64748b;margin-top:2px">作者：${escapeHtml(current.author)}</div>
          <div style="margin-top:8px">
            <div style="display:flex;justify-content:space-between;font-size:12px;color:#64748b;margin-bottom:4px"><span>阅读进度</span><span>${current.progress||0}%</span></div>
            <div style="height:6px;background:#ede9fe;border-radius:3px;overflow:hidden"><div style="width:${current.progress||0}%;height:100%;background:#8b5cf6;transition:width .3s"></div></div>
          </div>
          ${current.note?`<div style="font-size:12px;color:#64748b;margin-top:6px">📝 ${escapeHtml(current.note)}</div>`:''}
        </div>
        <div style="display:flex;gap:6px;margin-top:8px">
          <button class="btn btn-sm" style="flex:1;background:#dcfce7;color:#166534" onclick="finishBook()">标记读完</button>
          <button class="btn btn-sm" style="flex:1;background:#fee2e2;color:#991b1b" onclick="removeCurrentBook()">移除</button>
        </div>
      `:'<div class="empty">还没有正在读的书，点击「添加」开始</div>'}
    </div>
    <div class="card">
      <div class="card-title" style="justify-content:space-between">
        <span>🖍️ 阅读笔记</span>
        <button class="btn btn-sm" style="background:#8b5cf6;color:#fff" onclick="addBookNote()">+ 新笔记</button>
      </div>
      <div>
        ${notes.length?notes.slice().reverse().map(n=>`
          <div class="highlight-note" style="border-color:${n.color||'#fbbf24'};background:${n.bg||'#fef3c7'}">
            <div style="font-size:13px;line-height:1.6">${escapeHtml(n.text)}</div>
            <div style="display:flex;justify-content:space-between;align-items:center;margin-top:4px">
              <span style="font-size:10px;color:#64748b">${escapeHtml(n.book||'')} · ${escapeHtml(n.date||'')}</span>
              <span style="color:#cbd5e1;cursor:pointer;font-size:16px" onclick="delBookNote('${n.id}')">×</span>
            </div>
          </div>
        `).join(''):'<div class="empty">阅读时记下喜欢的句子吧</div>'}
      </div>
    </div>
    <div class="card">
      <div class="card-title">🌟 本月推荐</div>
      <div id="bookRec">
        ${BOOK_RECOMMEND.slice(0,3).map((b,i)=>`
          <div style="padding:12px;background:#f8fafc;border-radius:10px;margin-bottom:8px;cursor:pointer" onclick="showBookDetail(${i})">
            <div style="display:flex;justify-content:space-between;align-items:start">
              <div style="flex:1">
                <div style="font-weight:700;font-size:14px">${escapeHtml(b.title)}</div>
                <div style="font-size:11px;color:#64748b;margin-top:2px">${escapeHtml(b.author)} · ${escapeHtml(b.cat)}</div>
              </div>
              <span class="badge" style="background:#fef3c7;color:#92400e">⭐ ${b.score}</span>
            </div>
            <div style="font-size:12px;color:#64748b;margin-top:6px;line-height:1.5">${escapeHtml(b.reason)}</div>
          </div>
        `).join('')}
      </div>

    </div>
    ${history.length?`
      <div class="card">
        <div class="card-title">🏆 已读完 (${history.length})</div>
        ${history.slice().reverse().map(b=>`
          <div style="display:flex;justify-content:space-between;align-items:center;padding:8px;background:#f8fafc;border-radius:8px;margin-bottom:4px">
            <div><b style="font-size:13px">${escapeHtml(b.title)}</b> <span style="font-size:11px;color:#94a3b8">${escapeHtml(b.author||'')}</span></div>
            <span class="badge" style="background:#dcfce7;color:#166534">${escapeHtml(b.finishedDate||'')}</span>
          </div>
        `).join('')}
      </div>
    `:''}
  `;
}

function showBookDetail(idx){
  const b=BOOK_RECOMMEND[idx];
  showModal(`
    <h3 style="font-size:16px;font-weight:700;margin:0 0 8px">${escapeHtml(b.title)}</h3>
    <div style="font-size:12px;color:#64748b;margin-bottom:10px">作者：${escapeHtml(b.author)} · 评分：⭐${b.score} · 分类：${escapeHtml(b.cat)}</div>
    <div style="background:#faf5ff;padding:12px;border-radius:10px;font-size:13px;line-height:1.7;margin-bottom:12px"><b>💡 推荐理由：</b><br>${escapeHtml(b.reason)}</div>
    <div style="display:flex;gap:8px">
      <button class="btn" style="flex:1;background:#e2e8f0" onclick="closeModal()">关闭</button>
      <button class="btn" style="flex:1;background:#8b5cf6;color:#fff" onclick="startReading('${escapeHtml(b.title)}','${escapeHtml(b.author)}')">开始阅读</button>
    </div>
  `);
}
function showMoreBooks(){
  showModal(`
    <h3 style="font-size:16px;font-weight:700;margin:0 0 12px">🌟 书籍推荐库</h3>
    ${BOOK_RECOMMEND.map((b,i)=>`
      <div style="padding:12px;background:#f8fafc;border-radius:10px;margin-bottom:8px;cursor:pointer" onclick="showBookDetail(${i})">
        <div style="display:flex;justify-content:space-between;align-items:start">
          <div style="flex:1"><div style="font-weight:700;font-size:14px">${escapeHtml(b.title)}</div><div style="font-size:11px;color:#64748b;margin-top:2px">${escapeHtml(b.author)} · ${escapeHtml(b.cat)}</div></div>
          <span class="badge" style="background:#fef3c7;color:#92400e">⭐ ${b.score}</span>
        </div>
        <div style="font-size:12px;color:#64748b;margin-top:6px">${escapeHtml(b.reason)}</div>
      </div>
    `).join('')}
    <button class="btn" style="width:100%;background:#e2e8f0" onclick="closeModal()">关闭</button>
  `);
}
function startReading(title,author){
  const current={title,author,progress:0,startDate:todayKey(),note:''};
  setData(BOOK_KEY,current);
  closeModal(); renderBook(); toast(`开始阅读《${title}》`);
}
function addCurrentBook(){
  showModal(`
    <h3 style="font-size:16px;font-weight:700;margin:0 0 12px">添加当前阅读</h3>
    <label style="font-size:12px;color:#64748b">书名</label>
    <input class="field" id="cbTitle" placeholder="书名" style="margin:4px 0 10px">
    <label style="font-size:12px;color:#64748b">作者</label>
    <input class="field" id="cbAuthor" placeholder="作者" style="margin:4px 0 10px">
    <label style="font-size:12px;color:#64748b">当前进度(%)</label>
    <input class="field" id="cbProgress" type="number" min="0" max="100" value="0" style="margin:4px 0 12px">
    <div style="display:flex;gap:8px">
      <button class="btn" style="flex:1;background:#e2e8f0" onclick="closeModal()">取消</button>
      <button class="btn" style="flex:1;background:#8b5cf6;color:#fff" onclick="saveCurrentBook()">保存</button>
    </div>
  `);
}
function saveCurrentBook(){
  const title=document.getElementById('cbTitle').value.trim();
  if(!title){toast('请输入书名');return}
  const current={title,author:document.getElementById('cbAuthor').value.trim(),progress:parseInt(document.getElementById('cbProgress').value)||0,startDate:todayKey(),note:''};
  setData(BOOK_KEY,current); closeModal(); renderBook(); toast('已添加');
}
function editBookProgress(){
  const current=getData(BOOK_KEY,{});
  showModal(`
    <h3 style="font-size:16px;font-weight:700;margin:0 0 12px">更新阅读进度</h3>
    <div style="font-size:13px;color:#64748b;margin-bottom:10px">《${escapeHtml(current.title)}》</div>
    <label style="font-size:12px;color:#64748b">阅读进度(%)</label>
    <input class="field" id="upProgress" type="number" min="0" max="100" value="${current.progress||0}" style="margin:4px 0 10px">
    <label style="font-size:12px;color:#64748b">读书感想</label>
    <textarea class="field" id="upNote" placeholder="想到什么写什么..." style="margin:4px 0 12px;min-height:60px">${escapeHtml(current.note||'')}</textarea>
    <div style="display:flex;gap:8px">
      <button class="btn" style="flex:1;background:#e2e8f0" onclick="closeModal()">取消</button>
      <button class="btn" style="flex:1;background:#8b5cf6;color:#fff" onclick="saveBookProgress()">保存</button>
    </div>
  `);
}
function saveBookProgress(){
  const current=getData(BOOK_KEY,{});
  current.progress=parseInt(document.getElementById('upProgress').value)||0;
  current.note=document.getElementById('upNote').value.trim();
  setData(BOOK_KEY,current); closeModal(); renderBook(); toast('已更新');
}
function finishBook(){
  const current=getData(BOOK_KEY,null);
  if(!current)return;
  if(!confirm(`确认《${current.title}》已读完？`))return;
  const history=getData(BOOK_HISTORY_KEY,[]);
  const now=new Date();
  history.push({...current,finishedDate:todayKey(),month:`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`});
  setData(BOOK_HISTORY_KEY,history); setData(BOOK_KEY,null); renderBook(); toast('恭喜读完一本书！');
}
function removeCurrentBook(){
  if(!confirm('移除当前阅读？'))return;
  setData(BOOK_KEY,null); renderBook();
}

const NOTE_COLORS=[
  {name:'黄色高光',color:'#fbbf24',bg:'#fef3c7'},{name:'粉色高光',color:'#ec4899',bg:'#fce7f3'},
  {name:'绿色高光',color:'#22c55e',bg:'#dcfce7'},{name:'蓝色高光',color:'#3b82f6',bg:'#dbeafe'},
  {name:'紫色高光',color:'#8b5cf6',bg:'#ede9fe'},{name:'橙色荧光',color:'#f97316',bg:'#ffedd5'}
];
function addBookNote(){
  const current=getData(BOOK_KEY,{});
  showModal(`
    <h3 style="font-size:16px;font-weight:700;margin:0 0 8px">🖍️ 新建阅读笔记</h3>
    <label style="font-size:12px;color:#64748b">摘录内容</label>
    <textarea class="field" id="bnText" placeholder="摘抄喜欢的句子..." style="margin:4px 0 10px;min-height:80px"></textarea>
    <label style="font-size:12px;color:#64748b">来自哪本书</label>
    <input class="field" id="bnBook" value="${escapeHtml(current.title||'')}" placeholder="书名" style="margin:4px 0 10px">
    <label style="font-size:12px;color:#64748b">选择高光笔颜色</label>
    <div style="display:flex;gap:8px;margin:6px 0 12px;flex-wrap:wrap">
      ${NOTE_COLORS.map((c,i)=>`<div onclick="selectNoteColor(${i})" id="nc${i}" style="width:36px;height:36px;border-radius:8px;background:${c.bg};border:2px solid ${c.color};cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:10px">${c.name.slice(0,1)}</div>`).join('')}
    </div>
    <div style="display:flex;gap:8px">
      <button class="btn" style="flex:1;background:#e2e8f0" onclick="closeModal()">取消</button>
      <button class="btn" style="flex:1;background:#8b5cf6;color:#fff" onclick="saveBookNote()">保存</button>
    </div>
  `);
  window._noteColorIdx=0;
}
function selectNoteColor(i){ window._noteColorIdx=i; NOTE_COLORS.forEach((c,j)=>{ const el=document.getElementById('nc'+j); if(el) el.style.transform=j===i?'scale(1.15)':'scale(1)'; }); }
function saveBookNote(){
  const text=document.getElementById('bnText').value.trim();
  if(!text){toast('请输入内容');return}
  const c=NOTE_COLORS[window._noteColorIdx||0];
  const notes=getData(BOOK_NOTES_KEY,[]);
  notes.push({id:uid(),text,book:document.getElementById('bnBook').value.trim(),color:c.color,bg:c.bg,date:todayKey()});
  setData(BOOK_NOTES_KEY,notes); closeModal(); renderBook(); toast('笔记已保存');
}
function delBookNote(id){
  if(!confirm('删除这条笔记？'))return;
  let notes=getData(BOOK_NOTES_KEY,[]);
  notes=notes.filter(n=>n.id!==id);
  setData(BOOK_NOTES_KEY,notes); renderBook();
}
</script>

<script>
// ============ 减肥计划模块 ============
const FIT_WEIGHT_KEY='fit_weights';
const FIT_MEAL_KEY='fit_meals';
const FIT_GOAL_KEY='fit_goal';

function getFitGoal(){ return getData(FIT_GOAL_KEY,{target:55,start:0,height:165,age:25}); }

function renderFit(){
  const el=document.getElementById('panel-fit');
  const weights=getData(FIT_WEIGHT_KEY,[]).sort((a,b)=>a.date.localeCompare(b.date));
  const meals=getData(FIT_MEAL_KEY,[]).filter(m=>m.date===todayKey());
  const goal=getFitGoal();
  const todayW=weights.find(w=>w.date===todayKey());
  const startW=weights[0]?.value||goal.start;
  const currentW=weights[weights.length-1]?.value||startW;
  const lost=(startW-currentW).toFixed(1);
  const toGo=(currentW-goal.target).toFixed(1);
  const todayCal=meals.reduce((s,m)=>s+(m.cal||0),0);
  const recCal=calcRecCal(goal);

  el.innerHTML=`
    <div style="background:linear-gradient(135deg,#22c55e,#4ade80);color:#fff;border-radius:16px;padding:16px;margin-bottom:12px">
      <div style="font-size:18px;font-weight:800">⚖️ 减肥计划</div>
      <div style="display:flex;justify-content:space-between;margin-top:10px;font-size:12px">
        <div>当前 <b style="font-size:16px">${currentW}</b>kg</div>
        <div>目标 <b style="font-size:16px">${goal.target}</b>kg</div>
        <div>已减 <b style="font-size:16px">${lost>0?lost:0}</b>kg</div>
      </div>
    </div>
    <div class="card">
      <div class="card-title">📊 今日体重</div>
      ${todayW?`
        <div style="text-align:center;padding:12px;background:#f0fdf4;border-radius:10px">
          <div style="font-size:32px;font-weight:800;color:#22c55e">${todayW.value} <span style="font-size:14px">kg</span></div>
          <div style="font-size:12px;color:#64748b;margin-top:4px">${todayKey()} 已记录</div>
        </div>
        <button class="btn btn-sm" style="width:100%;margin-top:8px;background:#e2e8f0" onclick="inputWeight()">修改</button>
      `:`
        <div style="text-align:center;padding:12px;background:#f8fafc;border-radius:10px">
          <div style="font-size:13px;color:#94a3b8;margin-bottom:8px">今天还没记录空腹体重</div>
          <button class="btn" style="background:#22c55e;color:#fff" onclick="inputWeight()">录入体重</button>
        </div>
      `}
    </div>
    ${weights.length>=2?`
      <div class="card">
        <div class="card-title">📈 体重趋势</div>
        <canvas id="weightChart" height="160"></canvas>
        <div style="font-size:12px;color:#64748b;text-align:center;margin-top:8px">${toGo>0 ? '距离目标还差 '+toGo+'kg，继续加油！' : '🎉 目标已达成！'}</div>
      </div>
    `:''}
    <div class="card">
      <div class="card-title">🔥 今日摄入</div>
      <div style="display:flex;align-items:center;gap:12px">
        <svg width="80" height="80" viewBox="0 0 80 80">

          <circle cx="40" cy="40" r="32" fill="none" stroke="#22c55e" stroke-width="8"
            stroke-dasharray="${2*Math.PI*32}"
            stroke-dashoffset="${2*Math.PI*32*(1-Math.min(todayCal/recCal,1))}"

              <div style="display:flex;justify-content:space-between;align-items:center">
                <div style="font-weight:600;font-size:13px">${names[meal]}</div>
                ${m?`<span class="badge" style="background:#dcfce7;color:#166534">${m.cal}kcal</span>`:''}
              </div>
              ${m?`
                ${m.img?`<img src="${m.img}" style="width:100%;height:100px;object-fit:cover;border-radius:8px;margin-top:6px">`:''}
                <div style="font-size:12px;color:#64748b;margin-top:4px">${escapeHtml(m.desc||'')}</div>
                ${m.aiAdvice?`<div style="font-size:11px;color:#374151;margin-top:4px;padding:6px;background:#fff;border-radius:6px;border-left:3px solid #22c55e">${escapeHtml(m.aiAdvice)}</div>`:''}
                <span style="font-size:11px;color:#ef4444;cursor:pointer" onclick="delMeal('${m.id}')">删除</span>
              `:`
                <button class="btn btn-sm" style="margin-top:6px;background:#dcfce7;color:#166534" onclick="addMeal('${meal}')">+ 添加${names[meal]}</button>
              `}
            </div>
          `;
        }).join('')}
      </div>
    </div>
    <div class="card">
      <div class="card-title">⚙️ 个人设置</div>
      <div style="font-size:13px;color:#64748b;line-height:1.8">
        身高：${goal.height}cm｜年龄：${goal.age}<br>目标体重：${goal.target}kg<br>建议日摄入：${recCal}kcal
      </div>
      <button class="btn btn-sm" style="margin-top:8px;background:#e2e8f0" onclick="editFitGoal()">编辑设置</button>
    </div>
  `;

  if(weights.length>=2){
    setTimeout(()=>{
      const ctx=document.getElementById('weightChart');
      if(!ctx)return;
      new Chart(ctx,{
        type:'line',
        data:{labels:weights.map(w=>w.date.slice(5)),datasets:[{label:'体重(kg)',data:weights.map(w=>w.value),borderColor:'#22c55e',backgroundColor:'rgba(34,197,94,.1)',tension:.3,fill:true,pointRadius:3}]},
        options:{responsive:true,plugins:{legend:{display:false}},scales:{y:{beginAtZero:false}}}
      });
    },100);
  }
}

function calcRecCal(goal){
  const weights=getData(FIT_WEIGHT_KEY,[]);
  const w=weights[weights.length-1]?.value||goal.target;
  const bmr=655+(9.6*w)+(1.8*goal.height)-(4.7*goal.age);
  return Math.round(bmr*1.3*0.8);
}

function inputWeight(){
  const today=getData(FIT_WEIGHT_KEY,[]).find(w=>w.date===todayKey());
  showModal(`
    <h3 style="font-size:16px;font-weight:700;margin:0 0 12px">录入空腹体重</h3>
    <p style="font-size:12px;color:#64748b;margin:0 0 10px">建议每天早上起床后、如厕后、进食前称量</p>
    <input class="field" id="wInput" type="number" step="0.1" value="${today?today.value:''}" placeholder="如 55.5" style="font-size:20px;text-align:center;margin-bottom:12px">
    <div style="display:flex;gap:8px">
      <button class="btn" style="flex:1;background:#e2e8f0" onclick="closeModal()">取消</button>
      <button class="btn" style="flex:1;background:#22c55e;color:#fff" onclick="saveWeight()">保存</button>
    </div>
  `);
  setTimeout(()=>document.getElementById('wInput').focus(),100);
}
function saveWeight(){
  const val=parseFloat(document.getElementById('wInput').value);
  if(!val||val<30||val>200){toast('请输入合理体重');return}
  let weights=getData(FIT_WEIGHT_KEY,[]);
  const idx=weights.findIndex(w=>w.date===todayKey());
  if(idx>=0)weights[idx].value=val;
  else weights.push({id:uid(),date:todayKey(),value:val});
  setData(FIT_WEIGHT_KEY,weights);
  closeModal(); renderFit(); toast('已记录');
}

function addMeal(meal){
  const names={breakfast:'早餐',lunch:'午餐',dinner:'晚餐'};
  showModal(`
    <h3 style="font-size:16px;font-weight:700;margin:0 0 12px">添加${names[meal]}</h3>
    <label style="font-size:12px;color:#64748b">食物照片</label>
    <input type="file" id="mealImg" accept="image/*" style="margin:4px 0 10px;font-size:13px">
    <label style="font-size:12px;color:#64748b">食物描述（吃什么、大概多少）</label>
    <textarea class="field" id="mealDesc" placeholder="如：一碗米饭+番茄炒蛋+一小块鸡胸肉" style="margin:4px 0 10px;min-height:70px"></textarea>
    <label style="font-size:12px;color:#64748b">已知热量？(选填)</label>
    <input class="field" id="mealCal" type="number" placeholder="如 500 (kcal)" style="margin:4px 0 12px">
    <button class="btn" style="width:100%;background:#22c55e;color:#fff" onclick="estimateMeal('${meal}')">AI估算热量</button>
    <div id="mealResult" style="margin-top:12px"></div>
  `);
}
function estimateMeal(meal){
  const desc=document.getElementById('mealDesc').value.trim();
  const knownCal=parseInt(document.getElementById('mealCal').value);
  if(knownCal){ saveMealRecord(meal,desc,knownCal,'',''); return; }
  if(!desc){toast('请描述食物内容');return}
  const r=document.getElementById('mealResult');
  r.innerHTML='<div style="text-align:center;padding:16px;color:#94a3b8">🤖 AI估算中...</div>';
  setTimeout(()=>{
    const est=estimateCalories(desc);
    const advice=mealAdvice(est,meal);
    // 用临时变量存储，避免 onclick 拼接字符串问题
    window._pendingMeal={meal,desc,cal:est,advice};
    r.innerHTML=`
      <div style="background:#f0fdf4;padding:12px;border-radius:10px;font-size:13px;line-height:1.7">
        <div style="font-weight:700;color:#22c55e;margin-bottom:6px">🔥 AI估算结果</div>
        <div>估算热量：<b>${est} kcal</b></div>
        <div style="margin-top:6px">${advice}</div>
      </div>
      <button class="btn" style="width:100%;margin-top:8px;background:#22c55e;color:#fff" onclick="confirmPendingMeal()">确认保存</button>
    `;
    const imgInput=document.getElementById('mealImg');
    if(imgInput.files[0]){
      const reader=new FileReader();
      reader.onload=e=>{ window._mealImgData=e.target.result; };
      reader.readAsDataURL(imgInput.files[0]);
    }
  },800);
}
function confirmPendingMeal(){
  if(!window._pendingMeal){toast('数据已过期，请重新估算');return}
  const m=window._pendingMeal;
  const img=window._mealImgData||'';
  saveMealRecord(m.meal,m.desc,m.cal,m.advice,img);
  window._mealImgData='';
  window._pendingMeal=null;
}
function saveMealRecord(meal,desc,cal,advice,img){
  const meals=getData(FIT_MEAL_KEY,[]);
  meals.push({id:uid(),meal,desc,cal,aiAdvice:advice,img,date:todayKey()});
  setData(FIT_MEAL_KEY,meals);
  closeModal(); renderFit(); toast('已记录');
}
function estimateCalories(desc){
  const db={'米饭':116,'面条':280,'馒头':220,'面包':250,'粥':60,'饺子':250,'鸡胸':133,'猪肉':240,'牛肉':125,'鱼':100,'虾':90,'鸡蛋':70,'番茄':18,'黄瓜':15,'白菜':17,'青菜':15,'土豆':77,'茄子':21,'牛奶':54,'豆浆':30,'酸奶':72,'咖啡':5,'苹果':52,'香蕉':89,'橙子':47,'西瓜':30,'汉堡':295,'薯条':312,'炸鸡':259,'披萨':266,'奶茶':300,'蛋糕':350,'巧克力':546,'饼干':433};
  let total=0;
  Object.keys(db).forEach(k=>{ if(desc.includes(k)) total+=db[k]; });
  if(total===0){
    if(/早餐|早上/.test(desc)&&!/午餐|晚餐/.test(desc)) total=350;
    else if(/午餐|晚饭|晚餐/.test(desc)) total=550;
    else total=400;
  }
  return total;
}
function mealAdvice(cal,meal){
  const goal=getFitGoal();
  const rec=calcRecCal(goal);
  const perMeal={breakfast:rec*0.3,lunch:rec*0.4,dinner:rec*0.3};
  const target=perMeal[meal]||400;
  const names={breakfast:'早餐',lunch:'午餐',dinner:'晚餐'};
  if(cal>target*1.3) return `⚠️ ${names[meal]}热量偏高（建议${Math.round(target)}kcal），建议：\n• 增加蔬菜比例，减少主食\n• 少油少糖烹饪\n• 饭后散步15分钟`;
  else if(cal<target*0.5) return `💡 ${names[meal]}热量偏低（建议${Math.round(target)}kcal），吃太少不利于减肥，建议：\n• 适量增加优质蛋白\n• 避免下一餐暴食`;
  else return `✅ ${names[meal]}热量合理（建议${Math.round(target)}kcal），继续保持！`;
}
function delMeal(id){
  if(!confirm('删除这餐记录？'))return;
  let meals=getData(FIT_MEAL_KEY,[]);
  meals=meals.filter(m=>m.id!==id);
  setData(FIT_MEAL_KEY,meals); renderFit();
}
function editFitGoal(){
  const g=getFitGoal();
  showModal(`
    <h3 style="font-size:16px;font-weight:700;margin:0 0 12px">个人设置</h3>
    <label style="font-size:12px;color:#64748b">身高(cm)</label>
    <input class="field" id="gHeight" type="number" value="${g.height}" style="margin:4px 0 10px">
    <label style="font-size:12px;color:#64748b">年龄</label>
    <input class="field" id="gAge" type="number" value="${g.age}" style="margin:4px 0 10px">
    <label style="font-size:12px;color:#64748b">目标体重(kg)</label>
    <input class="field" id="gTarget" type="number" step="0.1" value="${g.target}" style="margin:4px 0 12px">
    <div style="display:flex;gap:8px">
      <button class="btn" style="flex:1;background:#e2e8f0" onclick="closeModal()">取消</button>
      <button class="btn" style="flex:1;background:#22c55e;color:#fff" onclick="saveFitGoal()">保存</button>
    </div>
  `);
}
function saveFitGoal(){
  const goal={height:parseInt(document.getElementById('gHeight').value)||165,age:parseInt(document.getElementById('gAge').value)||25,target:parseFloat(document.getElementById('gTarget').value)||55};
  setData(FIT_GOAL_KEY,goal);
  closeModal(); renderFit(); toast('已保存');
}
</script>

<script>
// ============ 记账模块 ============
const ACCT_KEY='acct_entries';

const ACCT_CATS=[
  {id:'food',icon:'🍽️',name:'餐饮',type:'expense'},{id:'transport',icon:'🚇',name:'交通',type:'expense'},
  {id:'shop',icon:'🛍️',name:'购物',type:'expense'},{id:'xhs',icon:'📕',name:'小红书运营',type:'expense'},
  {id:'study',icon:'📚',name:'学习',type:'expense'},{id:'health',icon:'💊',name:'医疗',type:'expense'},
  {id:'entertain',icon:'🎮',name:'娱乐',type:'expense'},{id:'other_exp',icon:'📝',name:'其他支出',type:'expense'},
  {id:'salary',icon:'💰',name:'工资',type:'income'},{id:'sale',icon:'🛒',name:'店铺收入',type:'income'},
  {id:'side',icon:'💼',name:'副业',type:'income'},{id:'other_inc',icon:'➕',name:'其他收入',type:'income'}
];

function renderAcct(){
  const el=document.getElementById('panel-acct');
  const entries=getData(ACCT_KEY,[]);
  const now=new Date();
  const monthKey=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
  const monthEntries=entries.filter(e=>e.date.startsWith(monthKey));
  const income=monthEntries.filter(e=>e.type==='income').reduce((s,e)=>s+e.amount,0);
  const expense=monthEntries.filter(e=>e.type==='expense').reduce((s,e)=>s+e.amount,0);
  const balance=income-expense;
  const todayEntries=entries.filter(e=>e.date===todayKey());

  el.innerHTML=`
    <div style="background:linear-gradient(135deg,#14b8a6,#2dd4bf);color:#fff;border-radius:16px;padding:16px;margin-bottom:12px">
      <div style="font-size:18px;font-weight:800">💰 记账本</div>
      <div style="font-size:12px;opacity:.9;margin-top:4px">${now.getFullYear()}年${now.getMonth()+1}月</div>
      <div style="display:flex;justify-content:space-between;margin-top:12px">
        <div><div style="font-size:10px;opacity:.8">收入</div><div style="font-size:18px;font-weight:800">+${income.toFixed(2)}</div></div>
        <div><div style="font-size:10px;opacity:.8">支出</div><div style="font-size:18px;font-weight:800">-${expense.toFixed(2)}</div></div>
        <div><div style="font-size:10px;opacity:.8">结余</div><div style="font-size:18px;font-weight:800">${balance.toFixed(2)}</div></div>
      </div>
    </div>
    <div class="card">
      <div class="card-title" style="justify-content:space-between">
        <span>📋 今日明细</span><span style="font-size:12px;color:#94a3b8">${todayEntries.length} 笔</span>
      </div>
      <div>
        ${todayEntries.length?todayEntries.slice().reverse().map(e=>{
          const cat=ACCT_CATS.find(c=>c.id===e.cat)||{icon:'📝',name:'其他'};
          return `
            <div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #f1f5f9">
              <div style="font-size:20px">${cat.icon}</div>
              <div style="flex:1">
                <div style="font-size:13px;font-weight:600">${escapeHtml(e.note||cat.name)}</div>
                <div style="font-size:11px;color:#94a3b8">${cat.name}</div>
              </div>
              <div style="font-weight:700;font-size:14px;color:${e.type==='income'?'#22c55e':'#ef4444'}">${e.type==='income'?'+':'-'}${e.amount.toFixed(2)}</div>
              <span style="color:#cbd5e1;cursor:pointer" onclick="delEntry('${e.id}')">×</span>
            </div>
          `;
        }).join(''):'<div class="empty">今日还没有记账</div>'}
      </div>
    </div>
    ${monthEntries.length?`
      <div class="card"><div class="card-title">📊 本月支出分布</div><canvas id="acctChart" height="200"></canvas></div>
      <div class="card"><div class="card-title">📅 近7天趋势</div><canvas id="acctTrendChart" height="140"></canvas></div>
    `:''}
    <div class="card">
      <div class="card-title">⚡ 快速记账</div>
      <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px">
        ${ACCT_CATS.slice(0,8).map(c=>`
          <div onclick="quickAdd('${c.id}','${c.type}')" style="padding:10px 4px;background:#f8fafc;border-radius:10px;cursor:pointer;text-align:center">
            <div style="font-size:20px">${c.icon}</div><div style="font-size:10px;color:#64748b;margin-top:2px">${c.name}</div>
          </div>
        `).join('')}
      </div>
      <button class="btn btn-sm" style="width:100%;margin-top:8px;background:#14b8a6;color:#fff" onclick="addEntry()">全部分类</button>
    </div>
  `;

  if(monthEntries.length){
    setTimeout(()=>{
      const expenseByCat={};
      monthEntries.filter(e=>e.type==='expense').forEach(e=>{ expenseByCat[e.cat]=(expenseByCat[e.cat]||0)+e.amount; });
      const ctx1=document.getElementById('acctChart');
      if(ctx1 && Object.keys(expenseByCat).length){
        new Chart(ctx1,{
          type:'doughnut',
          data:{labels:Object.keys(expenseByCat).map(k=>ACCT_CATS.find(c=>c.id===k)?.name||k),datasets:[{data:Object.values(expenseByCat),backgroundColor:['#ef4444','#f59e0b','#8b5cf6','#06b6d4','#10b981','#ec4899','#6366f1','#94a3b8']}]},
          options:{responsive:true,plugins:{legend:{position:'right',labels:{font:{size:10},padding:8}}}}
        });
      }
      const ctx2=document.getElementById('acctTrendChart');
      if(ctx2){
        const days=[],dayData=[];
        for(let i=6;i>=0;i--){
          const d=new Date(); d.setDate(d.getDate()-i);
          const dk=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
          days.push(dk.slice(5));
          const dayExp=entries.filter(e=>e.date===dk&&e.type==='expense').reduce((s,e)=>s+e.amount,0);
          dayData.push(dayExp);
        }
        new Chart(ctx2,{type:'bar',data:{labels:days,datasets:[{label:'支出',data:dayData,backgroundColor:'#14b8a6'}]},options:{responsive:true,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true}}}});
      }
    },100);
  }
}

function quickAdd(catId,type){
  const cat=ACCT_CATS.find(c=>c.id===catId);
  showModal(`
    <h3 style="font-size:16px;font-weight:700;margin:0 0 12px">${cat.icon} ${cat.name}</h3>
    <input class="field" id="qaAmount" type="number" step="0.01" placeholder="金额" style="font-size:20px;text-align:center;margin-bottom:10px">
    <input class="field" id="qaNote" placeholder="备注(可选)" style="margin-bottom:12px">
    <div style="display:flex;gap:8px">
      <button class="btn" style="flex:1;background:#e2e8f0" onclick="closeModal()">取消</button>
      <button class="btn" style="flex:1;background:#14b8a6;color:#fff" onclick="saveQuickEntry('${catId}','${type}')">保存</button>
    </div>
  `);
  setTimeout(()=>document.getElementById('qaAmount').focus(),100);
}
function saveQuickEntry(catId,type){
  const amount=parseFloat(document.getElementById('qaAmount').value);
  if(!amount||amount<=0){toast('请输入金额');return}
  const note=document.getElementById('qaNote').value.trim();
  const entries=getData(ACCT_KEY,[]);
  entries.push({id:uid(),cat:catId,type,amount,note,date:todayKey(),time:Date.now()});
  setData(ACCT_KEY,entries);
  closeModal(); renderAcct(); toast('已记录');
}

function addEntry(){
  showModal(`
    <h3 style="font-size:16px;font-weight:700;margin:0 0 12px">新增记账</h3>
    <div style="display:flex;gap:8px;margin-bottom:12px">
      <button class="btn" style="flex:1;background:#ef4444;color:#fff" id="tabExpense" onclick="switchEntryType('expense')">支出</button>
      <button class="btn" style="flex:1;background:#e2e8f0" id="tabIncome" onclick="switchEntryType('income')">收入</button>
    </div>
    <div id="catGrid"></div>
    <input class="field" id="enAmount" type="number" step="0.01" placeholder="金额" style="font-size:20px;text-align:center;margin:10px 0">
    <input class="field" id="enNote" placeholder="备注(可选)" style="margin-bottom:12px">
    <div style="display:flex;gap:8px">
      <button class="btn" style="flex:1;background:#e2e8f0" onclick="closeModal()">取消</button>
      <button class="btn" style="flex:1;background:#14b8a6;color:#fff" onclick="saveEntry()">保存</button>
    </div>
  `);
  window._entryType='expense';
  showCatGrid();
}
function switchEntryType(type){
  window._entryType=type;
  document.getElementById('tabExpense').style.background=type==='expense'?'#ef4444':'#e2e8f0';
  document.getElementById('tabExpense').style.color=type==='expense'?'#fff':'#000';
  document.getElementById('tabIncome').style.background=type==='income'?'#22c55e':'#e2e8f0';
  document.getElementById('tabIncome').style.color=type==='income'?'#fff':'#000';
  showCatGrid();
}
function showCatGrid(){
  const cats=ACCT_CATS.filter(c=>c.type===window._entryType);
  document.getElementById('catGrid').innerHTML=`
    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px">
      ${cats.map(c=>`
        <div onclick="selectCat('${c.id}',this)" class="cat-sel" data-id="${c.id}" style="padding:10px 4px;background:#f8fafc;border-radius:10px;cursor:pointer;text-align:center;border:2px solid transparent">
          <div style="font-size:20px">${c.icon}</div><div style="font-size:10px;color:#64748b;margin-top:2px">${c.name}</div>
        </div>
      `).join('')}
    </div>
  `;
  window._selectedCat=null;
}
function selectCat(id,el){
  window._selectedCat=id;
  document.querySelectorAll('.cat-sel').forEach(e=>e.style.border='2px solid transparent');
  el.style.border='2px solid #14b8a6';
}
function saveEntry(){
  const amount=parseFloat(document.getElementById('enAmount').value);
  if(!amount||amount<=0){toast('请输入金额');return}
  if(!window._selectedCat){toast('请选择分类');return}
  const note=document.getElementById('enNote').value.trim();
  const entries=getData(ACCT_KEY,[]);
  entries.push({id:uid(),cat:window._selectedCat,type:window._entryType,amount,note,date:todayKey(),time:Date.now()});
  setData(ACCT_KEY,entries);
  closeModal(); renderAcct(); toast('已记录');
}
function delEntry(id){
  if(!confirm('删���这条记录？'))return;
  let entries=getData(ACCT_KEY,[]);
  entries=entries.filter(e=>e.id!==id);
  setData(ACCT_KEY,entries); renderAcct();
}
</script>

<script>
// ============ 数据同步（跨Safari/PWA） ============
function exportAllData(){
  const allData = localStorage.getItem(STORE_KEY);
  if(!allData){toast('没有可导出的数据');return}
  try{
    navigator.clipboard.writeText(allData).then(()=>{
      toast('✅ 数据已复制到剪贴板！切换到目标页面后点「导入数据」');
    }).catch(()=>{
      // fallback：显示在弹窗中
      showModal(`
        <h3 style="font-size:16px;font-weight:700;margin:0 0 8px">📤 导出数据</h3>
        <p style="font-size:12px;color:#64748b;margin:0 0 10px">长按下方文本全选复制，然后切换到目标页面点「导入数据」</p>
        <textarea class="field" style="min-height:80px;font-size:11px;word-break:break-all" readonly onclick="this.select()">${allData.replace(/</g,'&lt;').replace(/>/g,'&gt;')}</textarea>
        <button class="btn" style="width:100%;margin-top:8px;background:#e2e8f0" onclick="closeModal()">关闭</button>
      `);
    });
  }catch(e){toast('导出失败：'+e.message)}
}

function importAllData(){
  // 尝试从剪贴板读取
  if(navigator.clipboard && navigator.clipboard.readText){
    navigator.clipboard.readText().then(text=>{
      doImport(text);
    }).catch(()=>{
      showImportModal();
    });
  }else{
    showImportModal();
  }
}

function showImportModal(){
  showModal(`
    <h3 style="font-size:16px;font-weight:700;margin:0 0 8px">📥 导入数据</h3>
    <p style="font-size:12px;color:#64748b;margin:0 0 10px">粘贴之前导出的数据</p>
    <textarea class="field" id="importData" placeholder="粘贴数据..." style="min-height:80px;font-size:11px;word-break:break-all"></textarea>
    <div style="display:flex;gap:8px;margin-top:8px">
      <button class="btn" style="flex:1;background:#e2e8f0" onclick="closeModal()">取消</button>
      <button class="btn" style="flex:1;background:#10b981;color:#fff" onclick="doImportFromModal()">确认导入</button>
    </div>
  `);
  setTimeout(()=>{ const el=document.getElementById('importData'); if(el) el.focus(); },100);
}

function doImportFromModal(){
  const text=document.getElementById('importData').value.trim();
  doImport(text);
}

function doImport(text){
  if(!text){toast('请粘贴数据');return}
  try{
    const data=JSON.parse(text);
    if(typeof data!=='object'){toast('数据格式错误');return}
    localStorage.setItem(STORE_KEY, text);
    store=data;
    closeModal();
    toast('✅ 导入成功！刷新中...');
    setTimeout(()=>location.reload(),500);
  }catch(e){toast('数据格式错误，请确认粘贴完整')}
}

// ============ 启动 ============
function boot(){
  initPanels();
  buildSidebar();
  renderDaily();
  renderXHS();
  renderJob();
  renderEng();
  renderBook();
  renderShoot();
  renderClip();
  renderFit();
  renderAcct();
  switchPanel('daily');
}
boot();
</script>
